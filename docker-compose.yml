services:
  nexus:
    build: .
    container_name: pnevma-nexus
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
    depends_on:
      - ollama
    networks: [nexus]

  ollama:
    image: ollama/ollama:latest
    container_name: pnevma-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    networks: [nexus]

networks:
  nexus:

volumes:
  ollama_models:
